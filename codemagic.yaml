workflows:
  # ─────────────────────────────────────────────────────────
  # 1) YOXLAMA BUILD-İ — signing YOXDUR, simulator üçün build.
  #    Hər main push-da işləyir. iOS layihəsinin düzgün qurulduğunu yoxlayır.
  # ─────────────────────────────────────────────────────────
  ios-verify:
    name: iOS Verify Build (unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Add/verify iOS platform
        script: |
          rm -rf ios

          if ! npm ls @capacitor/ios >/dev/null 2>&1; then
            echo "==> @capacitor/ios tapılmadı, quraşdırılır..."
            npm install @capacitor/ios --no-save
          fi

          npx cap add ios
          npx cap sync ios

          echo "==> ios/App qovluğunun məzmunu:"
          ls -la ios/App || echo "XƏTA: ios/App qovluğu yaranmadı!"

          if [ -f ios/App/Podfile ]; then
            echo "==> CocoaPods aşkarlandı (Podfile var)."
          elif [ -d ios/App/CapApp-SPM ]; then
            echo "==> Swift Package Manager (SPM) aşkarlandı — Podfile/pod install lazım deyil."
          else
            echo "XƏTA: nə Podfile, nə də CapApp-SPM tapılmadı. iOS platforması düzgün yaradılmayıb."
            exit 1
          fi
      - name: Install CocoaPods dependencies (yalnız CocoaPods istifadə olunarsa)
        script: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App && pod install
          else
            echo "==> Podfile yoxdur (SPM istifadə olunur), bu addım ötürülür."
          fi
      - name: Build for iOS Simulator (no signing needed)
        script: |
          cd ios/App
          if [ -f App.xcworkspace/contents.xcworkspacedata ]; then
            echo "==> App.xcworkspace ilə build edilir (CocoaPods)"
            xcodebuild build \
              -workspace App.xcworkspace \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "==> App.xcodeproj ilə build edilir (SPM)"
            xcodebuild build \
              -project App.xcodeproj \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
          fi
    artifacts:
      - ios/App/build/**/*.app

  # ─────────────────────────────────────────────────────────
  # 2) RELEASE BUILD — App Store Connect-ə (TestFlight) göndərir.
  #    Codemagic-də "gencler_appstore_connect" adlı App Store Connect
  #    API inteqrasiyası qurulmalıdır.
  #    İşə salmaq: Codemagic-də "Start new build" → ios-release,
  #    və ya:  git tag ios-1 && git push origin ios-1
  # ─────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gencler_appstore_connect
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - apple_signing
      vars:
        BUNDLE_ID: az.mys.genclerplatformasi
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-*'
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Create iOS platform
        script: |
          rm -rf ios
          npx cap add ios
      - name: Prepare app icon and splash
        script: |
          # App Store ikonunda alfa kanalı (şəffaflıq) ola bilməz.
          # assets/icon.png ağ fonla düzləşdirilir (yalnız bu build-də).
          node -e "
            const sharp = require('sharp');
            sharp('assets/icon.png')
              .flatten({ background: '#ffffff' })
              .removeAlpha()
              .toFile('assets/icon-flat.png')
              .then(() => require('fs').renameSync('assets/icon-flat.png', 'assets/icon.png'))
              .catch(e => { console.error('Ikon duzlesdirilmedi:', e.message); process.exit(0); });
          "
          npx capacitor-assets generate --ios
      - name: Sync iOS platform
        script: |
          npx cap sync ios
          if [ -f ios/App/Podfile ]; then
            echo "==> CocoaPods aşkarlandı (Podfile var)."
          elif [ -d ios/App/CapApp-SPM ]; then
            echo "==> Swift Package Manager (SPM) aşkarlandı."
          else
            echo "XƏTA: iOS platforması düzgün yaradılmayıb."
            exit 1
          fi
      - name: Install CocoaPods dependencies (yalnız CocoaPods istifadə olunarsa)
        script: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App && pod install
          else
            echo "==> Podfile yoxdur (SPM istifadə olunur), bu addım ötürülür."
          fi
      - name: Set Info.plist permissions and export compliance
        script: |
          PLIST="ios/App/App/Info.plist"
          set_plist() {
            /usr/libexec/PlistBuddy -c "Set :$1 $3" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$PLIST"
          }
          set_plist NSCameraUsageDescription string "The camera is used to scan QR codes to check in at youth houses and events."
          set_plist NSPhotoLibraryUsageDescription string "Photo library access is used to choose a profile photo."
          set_plist ITSAppUsesNonExemptEncryption bool false
          echo "==> Info.plist:"
          cat "$PLIST"
      - name: Set up code signing
        script: |
          # Apple-dan distribution sertifikatı və App Store profilini alır;
          # yoxdursa, avtomatik yaradır (--create).
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          echo "==> Yuklenmis profiller:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          cd ios/App
          xcode-project use-profiles --project App.xcodeproj
          echo "==> Layihe imza parametrleri:"
          grep -n "PROVISIONING_PROFILE\|CODE_SIGN_STYLE\|DEVELOPMENT_TEAM\|CODE_SIGN_IDENTITY" App.xcodeproj/project.pbxproj | head -20
      - name: Set build number
        script: |
          # Codemagic-in avtomatik artan $BUILD_NUMBER sayğacı istifadə olunur.
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBX"
          grep -n "CURRENT_PROJECT_VERSION\|MARKETING_VERSION" "$PBX" | head -6
      - name: Build ipa for release
        script: |
          cd ios/App
          if [ -f App.xcworkspace/contents.xcworkspacedata ]; then
            echo "==> App.xcworkspace ilə build edilir (CocoaPods)"
            xcode-project build-ipa \
              --workspace "App.xcworkspace" \
              --scheme "App"
          else
            echo "==> App.xcodeproj ilə build edilir (SPM)"
            xcode-project build-ipa \
              --project "App.xcodeproj" \
              --scheme "App"
          fi
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
