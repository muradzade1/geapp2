workflows:
  # ─────────────────────────────────────────────────────────
  # 1) YOXLAMA BUILD-İ — Apple Developer hesabı təsdiqlənənə qədər
  #    Signing YOXDUR, sadəcə iOS layihəsinin düzgün build olduğunu
  #    yoxlamaq üçündür (simulator üçün build).
  # ─────────────────────────────────────────────────────────
  ios-verify:
    name: iOS Verify Build (unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Add/verify iOS platform
        script: |
          rm -rf ios

          # @capacitor/ios paketinin mövcudluğunu təmin edirik.
          # Bu paket olmadan `cap add ios` Podfile daxil olmaqla
          # native layihəni düzgün yarada bilmir.
          if ! npm ls @capacitor/ios >/dev/null 2>&1; then
            echo "==> @capacitor/ios tapılmadı, quraşdırılır..."
            npm install @capacitor/ios --no-save
          fi

          npx cap add ios
          npx cap sync ios

          echo "==> ios/App qovluğunun məzmunu:"
          ls -la ios/App || echo "XƏTA: ios/App qovluğu yaranmadı!"

          echo "==> Podfile axtarılır:"
          find ios -maxdepth 3 -name "Podfile" || echo "XƏTA: Podfile tapılmadı!"

          # Podfile hələ də yoxdursa, build-i aydın mesajla dayandırırıq
          if [ ! -f ios/App/Podfile ]; then
            echo "XƏTA: ios/App/Podfile yaradılmadı. capacitor.config faylını və @capacitor/ios paketini yoxlayın."
            exit 1
          fi
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Build for iOS Simulator (no signing needed)
        script: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/**/*.app

  # ─────────────────────────────────────────────────────────
  # 2) RELEASE BUILD — Apple Developer Program təsdiqləndikdən
  #    və Codemagic-də "iOS code signing" (App Store Connect API
  #    key) inteqrasiyası qurulduqdan SONRA aktivləşdiriləcək.
  #    Hazırda referans/hazır vəziyyətdə saxlanılır.
  # ─────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gencler_appstore_connect
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: az.mys.genclerplatformasi
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-*'
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Sync iOS platform
        script: |
          if ! npm ls @capacitor/ios >/dev/null 2>&1; then
            echo "==> @capacitor/ios tapılmadı, quraşdırılır..."
            npm install @capacitor/ios --no-save
          fi

          npx cap sync ios

          echo "==> Podfile axtarılır:"
          find ios -maxdepth 3 -name "Podfile" || echo "XƏTA: Podfile tapılmadı!"

          if [ ! -f ios/App/Podfile ]; then
            echo "XƏTA: ios/App/Podfile yaradılmadı. capacitor.config faylını və @capacitor/ios paketini yoxlayın."
            exit 1
          fi
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-app-store-build-number "az.mys.genclerplatformasi") + 1))
      - name: Build ipa for release
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
