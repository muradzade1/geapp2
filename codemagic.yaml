workflows:
  # ─────────────────────────────────────────────────────────
  # 1) YOXLAMA BUILD-İ — Apple Developer hesabı təsdiqlənənə qədər
  #    Signing YOXDUR, sadəcə iOS layihəsinin düzgün build olduğunu
  #    yoxlamaq üçündür (simulator üçün build).
  # ─────────────────────────────────────────────────────────
  ios-verify:
    name: iOS Verify Build (unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Add/verify iOS platform
        script: |
          rm -rf ios

          # @capacitor/ios paketinin mövcudluğunu təmin edirik.
          # Bu paket olmadan `cap add ios` Podfile daxil olmaqla
          # native layihəni düzgün yarada bilmir.
          if ! npm ls @capacitor/ios >/dev/null 2>&1; then
            echo "==> @capacitor/ios tapılmadı, quraşdırılır..."
            npm install @capacitor/ios --no-save
          fi

          npx cap add ios
          npx cap sync ios

          echo "==> ios/App qovluğunun məzmunu:"
          ls -la ios/App || echo "XƏTA: ios/App qovluğu yaranmadı!"

          # Bu layihə Capacitor-un Swift Package Manager (SPM) inteqrasiyasını
          # istifadə edir (CapApp-SPM qovluğu və Package.swift buna dəlildir).
          # Bu halda Podfile YARANMIR və pod install lazım deyil —
          # build birbaşa .xcodeproj üzərindən gedir.
          if [ -f ios/App/Podfile ]; then
            echo "==> CocoaPods aşkarlandı (Podfile var)."
          elif [ -d ios/App/CapApp-SPM ]; then
            echo "==> Swift Package Manager (SPM) aşkarlandı — Podfile/pod install lazım deyil."
          else
            echo "XƏTA: nə Podfile, nə də CapApp-SPM tapılmadı. iOS platforması düzgün yaradılmayıb."
            exit 1
          fi
      - name: Install CocoaPods dependencies (yalnız CocoaPods istifadə olunarsa)
        script: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App && pod install
          else
            echo "==> Podfile yoxdur (SPM istifadə olunur), bu addım ötürülür."
          fi
      - name: Build for iOS Simulator (no signing needed)
        script: |
          cd ios/App
          if [ -f App.xcworkspace/contents.xcworkspacedata ]; then
            echo "==> App.xcworkspace ilə build edilir (CocoaPods)"
            xcodebuild build \
              -workspace App.xcworkspace \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "==> App.xcodeproj ilə build edilir (SPM)"
            xcodebuild build \
              -project App.xcodeproj \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
          fi
    artifacts:
      - ios/App/build/**/*.app

  # ─────────────────────────────────────────────────────────
  # 2) RELEASE BUILD — Apple Developer Program təsdiqləndikdən
  #    və Codemagic-də "iOS code signing" (App Store Connect API
  #    key) inteqrasiyası qurulduqdan SONRA aktivləşdiriləcək.
  #    Hazırda referans/hazır vəziyyətdə saxlanılır.
  # ─────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gencler_appstore_connect
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: az.mys.genclerplatformasi
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-*'
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Sync iOS platform
        script: |
          if ! npm ls @capacitor/ios >/dev/null 2>&1; then
            echo "==> @capacitor/ios tapılmadı, quraşdırılır..."
            npm install @capacitor/ios --no-save
          fi

          npx cap sync ios

          # Bu layihə Capacitor SPM inteqrasiyasını istifadə edə bilər —
          # bu halda Podfile yaranmır, CapApp-SPM qovluğu yaranır.
          if [ -f ios/App/Podfile ]; then
            echo "==> CocoaPods aşkarlandı (Podfile var)."
          elif [ -d ios/App/CapApp-SPM ]; then
            echo "==> Swift Package Manager (SPM) aşkarlandı — Podfile/pod install lazım deyil."
          else
            echo "XƏTA: nə Podfile, nə də CapApp-SPM tapılmadı. iOS platforması düzgün yaradılmayıb."
            exit 1
          fi
      - name: Install CocoaPods dependencies (yalnız CocoaPods istifadə olunarsa)
        script: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App && pod install
          else
            echo "==> Podfile yoxdur (SPM istifadə olunur), bu addım ötürülür."
          fi
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-app-store-build-number "az.mys.genclerplatformasi") + 1))
      - name: Build ipa for release
        script: |
          cd ios/App
          if [ -f App.xcworkspace/contents.xcworkspacedata ]; then
            echo "==> App.xcworkspace ilə build edilir (CocoaPods)"
            xcode-project build-ipa \
              --workspace "App.xcworkspace" \
              --scheme "App"
          else
            echo "==> App.xcodeproj ilə build edilir (SPM)"
            xcode-project build-ipa \
              --project "App.xcodeproj" \
              --scheme "App"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
